name: CI Pipeline - Threat Intel Agent

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Code Quality & Type Safety
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff Linting
        run: |
          ruff check src/ tests/

      - name: Run Mypy Strict Type Checking
        run: |
          mypy src/ti_agent/

  test-and-coverage:
    name: Test Suite & Coverage Gate
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Unit & Integration Tests (Coverage >= 80%)
        run: |
          pytest tests/ --cov=ti_agent --cov-report=term-missing --cov-report=xml --cov-fail-under=80

      - name: CLI Offline Smoke Test
        run: |
          ti-agent version
          ti-agent analyze CVE-2021-44228 --offline --format markdown
          ti-agent analyze 8.8.8.8 --offline --format json
          ti-agent rag eval --top-k 3
